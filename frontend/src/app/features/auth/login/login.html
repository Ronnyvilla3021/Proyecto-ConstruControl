<div class="login-container">
  <div class="login-card">
    <h1>ConstruControl</h1>
    <p class="subtitle">Inicia sesión para continuar</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="campo">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="admin@construcontrol.com" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="error">Ingrese un email válido.</span>
        }
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="error">La contraseña es obligatoria.</span>
        }
      </div>

      @if (errorMensaje()) {
        <div class="error-general">{{ errorMensaje() }}</div>
      }

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
