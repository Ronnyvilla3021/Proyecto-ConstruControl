@if (authService.estaAutenticado()) {
  <nav>
    <a routerLink="/obras" routerLinkActive="active">Obras</a>
    <a routerLink="/materiales" routerLinkActive="active">Materiales</a>
    <a routerLink="/compras" routerLinkActive="active">Compras</a>
    <a routerLink="/consumo" routerLinkActive="active">Consumo</a>
    <a routerLink="/personal" routerLinkActive="active">Personal</a>
    <span class="usuario">{{ authService.usuario()?.nombreCompleto }} ({{ authService.rol() }})</span>
    <button (click)="logout()">Cerrar sesión</button>
  </nav>
}

<main>
  <router-outlet></router-outlet>
</main>
